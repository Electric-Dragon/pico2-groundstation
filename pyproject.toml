[project]
name = "pico-groundstation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "polytope3d"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100